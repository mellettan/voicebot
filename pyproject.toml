[project]
name = "voicebot"
version = "0.2.0"
description = "Real-time голосовой ассистент: SaluteSpeech (STT/TTS) + GigaChat через WebSocket"
readme = "README.md"
authors = [{ name = "Roman Medvedev", email = "roma23470@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.11,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "httpx>=0.28.1,<0.29",
    "grpcio>=1.71.0,<2",
    "protobuf>=5.29.3,<6",
    "redis>=5.2.1,<6",
    "langchain-core>=0.3.40,<0.4",
    "langchain-gigachat>=0.3.4,<0.4",
    "pydantic-settings>=2.8.1,<3",
    "loguru>=0.7.3,<0.8",
]

[project.scripts]
voicebot = "voicebot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "fakeredis>=2.28.0",
    "ruff>=0.11.0",
    "grpcio-tools>=1.71.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebot"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/voicebot/stt/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
